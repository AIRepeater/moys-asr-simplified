name: Python lint

on:
  pull_request:
  push:
    # 所有分支：非 main 分支的 push 也能得到 lint 反馈。
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: python-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run Ruff check
        run: uv run ruff check

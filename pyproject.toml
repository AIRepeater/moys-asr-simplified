[project]
name = "moys-asr-workflow"
version = "1.5.0-beta.4"
description = "A small cloud ASR workflow: transcribe local media with Qwen/DashScope and output SRT subtitles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "jieba==0.42.1",
    "pywebview==6.2.1; sys_platform != 'linux'",
    "pywebview[qt]==6.2.1; sys_platform == 'linux'",
    "requests==2.34.2",
]

[tool.ruff]
target-version = "py311"
include = [
    "*.py",
    "maw/**/*.py",
    "scripts/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
build = [
    "pyinstaller==6.16.0",
]
dev = [
    "ruff>=0.16.3",
]
